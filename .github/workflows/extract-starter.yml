name: Extract Mifask Starter ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded starter archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "No ZIP archive present; nothing to extract."
            exit 0
          fi
          mkdir -p /tmp/mifask-starter
          unzip -o "$ARCHIVE" -d /tmp/mifask-starter
          SOURCE_DIR=$(find /tmp/mifask-starter -type d -name mifask-islamic-encyclopedia | head -n 1)
          if [ -z "$SOURCE_DIR" ]; then
            echo "Expected starter folder not found in archive."
            exit 1
          fi
          cp -a "$SOURCE_DIR/." .
          rm -f "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes."
          else
            git commit -m "Add Mifask Islamic Encyclopedia starter source"
            git push
          fi
