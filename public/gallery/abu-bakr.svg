<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#143c2c"/><stop offset="1" stop-color="#081d16"/></linearGradient><pattern id="p" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M35 3 67 35 35 67 3 35Z" fill="none" stroke="#d8bd78" stroke-opacity=".15"/></pattern></defs><rect width="1000" height="1300" fill="url(#g)"/><rect width="1000" height="1300" fill="url(#p)"/><circle cx="500" cy="480" r="300" fill="none" stroke="#d8bd78" opacity=".25"/><text x="500" y="190" text-anchor="middle" font-family="Georgia" font-size="36" fill="#d8bd78" letter-spacing="10">✦ MIFASK ✦</text><text x="500" y="455" text-anchor="middle" font-family="Arial" font-size="130" font-weight="bold" fill="#f5efdf">ABU BAKR</text><text x="500" y="530" text-anchor="middle" font-family="Georgia" font-size="42" fill="#d8bd78">AS-SIDDIQ</text><path d="M220 590H780" stroke="#d8bd78"/><text x="500" y="650" text-anchor="middle" font-family="Arial" font-size="24" fill="#f5efdf">LOYALTY · FAITH · LEADERSHIP</text><foreignObject x="125" y="720" width="750" height="250"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#f5efdf;text-align:center;font-size:30px;line-height:1.55">Close companion of Prophet Muhammad ﷺ and the first caliph (632–634 CE). He accompanied the Prophet during the Hijrah. His caliphate saw the Qur’an gathered into one collection, following Umar’s suggestion.</div></foreignObject><text x="500" y="1130" text-anchor="middle" font-family="Georgia" font-size="30" fill="#d8bd78">Explore · Learn · Reflect</text><text x="500" y="1210" text-anchor="middle" font-family="Arial" font-size="26" fill="#f5efdf" letter-spacing="8">MIFASK ISLAMIC ENCYCLOPEDIA</text><text x="500" y="1260" text-anchor="middle" font-family="Arial" font-size="18" fill="#d8bd78">ORIGINAL MIFASK ART • SHARE BENEFICIAL KNOWLEDGE</text></svg>