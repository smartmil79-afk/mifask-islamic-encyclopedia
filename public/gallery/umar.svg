80 1040" fill="none" stroke="#c5a86e" stroke-width="18" opacity=".4"/></g><text x="500" y="1175" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="900" letter-spacing="5" fill="#c5a86e">JUSTICE · REFLECTION</text><rect x="84" y="1188" width="832" height="168" rx="12" fill="#183b52"/><text x="120" y="1230" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f5efdf">LEARN &amp; REFLECT</text><text x="120" y="1270" font-family="Arial,sans-serif" font-size="25" fill="#f5efdf">The second caliph, remembered for</text><text x="120" y="1300" font-family="Arial,sans-serif" font-size="25" fill="#f5efdf">justice, courage and accountability.</text><text x="120" y="1330" font-family="Arial,sans-serif" font-size="25" fill="#f5efdf">His leadership is a lasting lesson</text><text x="120" y="1360" font-family="Arial,sans-serif" font-size="25" fill="#f5efdf">in fairness and responsibility.</text></svg>